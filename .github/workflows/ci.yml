name: CI / Production Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Mypy Type Checker
        run: |
          mypy core services --ignore-missing-imports

  test:
    name: Test Suite & Aggregator Contracts
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov respx freezegun

      - name: Run Pytest with Coverage
        env:
          ENV: dev
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
        run: |
          pytest -v --cov=. --cov-report=term-missing --cov-fail-under=75

      - name: Run Aggregator Contract Tests
        run: |
          pytest -v tests/test_aggregator_contracts.py

      - name: Run Golden Matcher Evaluation
        run: |
          python scripts/eval_matcher.py
